<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Астра Континенталь · Студия 61 · v0.3</title><style>*{box-sizing:border-box}body{margin:0;background:#17232b;color:#f9f7f3;font:14px system-ui,Arial}header{padding:12px 16px;background:#23333e}h1{font-size:18px;margin:0 0 4px}small{color:#b9d0d6}canvas{display:block;width:100%;height:calc(100dvh - 148px);touch-action:none}footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;background:#23333e}button{border:0;border-radius:9px;padding:11px 14px;background:#e5d6bc;color:#20303a;font-weight:700;cursor:pointer}button.active{background:#7ac8d6}#note{font-size:11px;color:#cbd4d7;text-align:center;padding:5px}</style></head><body><header><h1>ЖК «Астра Континенталь» · студия №61</h1><small>Версия 0.3 · прихожая, санузел, окно справа, лоджия снизу · концепция, не обмерный чертёж</small></header><canvas id="c"></canvas><footer><button id="plan" class="active">План сверху</button><button id="view">3D-обзор</button><button id="left">↶ Повернуть</button><button id="right">Повернуть ↷</button><button id="bed">Разложить кровать</button></footer><div id="note">Кровать 140×200 · библиотека · гардероб · кухня · площади по предоставленному плану. Размеры стен условные.</div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,S,mode='plan',bed=false,angle=-.65,tilt=.67,drag=false,last=0;function resize(){let d=Math.min(devicePixelRatio||1,2);W=c.width=c.clientWidth*d;H=c.height=c.clientHeight*d;S=Math.min(W/7.5,H/9.4);draw()}addEventListener('resize',resize);
// Координаты условные: x слева направо, z от прихожей к лоджии. Единица приблизительно метр.
const R=[{x:0,z:0,w:2.0,h:1.85,n:'ПРИХОЖАЯ',area:'3,70 м²',fill:'#e7d7bd'},{x:2,z:0,w:1.91,h:1.85,n:'САНУЗЕЛ',area:'3,54 м²',fill:'#c6d8da'},{x:0,z:1.85,w:3.91,h:3.86,n:'КОМНАТА + КУХНЯ',area:'15,08 м²',fill:'#f4e7d4'},{x:0,z:5.71,w:3.91,h:1.07,n:'ЛОДЖИЯ',area:'4,19 м²',fill:'#b7dbe2'}];const furniture=[{x:.14,z:.14,w:1.65,h:.43,name:'ГАРДЕРОБ',color:'#a58765',height:1.8},{x:2.14,z:.17,w:.7,h:.72,name:'ДУШ',color:'#8bb5c0',height:.25},{x:3.03,z:.25,w:.46,h:.48,name:'WC',color:'#e5e6e2',height:.5},{x:2.05,z:2.0,w:1.72,h:.55,name:'КУХНЯ',color:'#b9a185',height:.95},{x:.10,z:2.05,w:.40,h:2.9,name:'БИБЛИОТЕКА',color:'#806348',height:2.15},{x:.54,z:3.13,w:.48,h:1.64,name:'ШКАФ-КРОВАТЬ',color:'#b39779',height:2.15},{x:2.7,z:4.18,w:.73,h:.73,name:'СТОЛ',color:'#c5a77f',height:.75},{x:.18,z:6.02,w:1.25,h:.45,name:'РАБОЧЕЕ МЕСТО',color:'#a18b73',height:.72}];
function project(x,y,z){let X=x-1.955,Z=z-3.25,ca=Math.cos(angle),sa=Math.sin(angle),a=X*ca-Z*sa,b=X*sa+Z*ca;return [W/2+(a)*S*.86,H*.56+(b*Math.sin(tilt)-y*Math.cos(tilt))*S*.86]}function poly(points,color,stroke='#ffffff30'){ctx.beginPath();points.forEach((p,i)=>{let q=project(...p);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}function box(x,z,w,h,height,col){poly([[x,0,z],[x+w,0,z],[x+w,0,z+h],[x,0,z+h]],col);poly([[x,height,z],[x+w,height,z],[x+w,height,z+h],[x,height,z+h]],col);poly([[x,0,z+h],[x+w,0,z+h],[x+w,height,z+h],[x,height,z+h]],'#00000022');poly([[x+w,0,z],[x+w,0,z+h],[x+w,height,z+h],[x+w,height,z]],'#00000033')}
function textAt(t,x,z,size=12,color='#25363d'){ctx.fillStyle=color;ctx.font=`600 ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(t,x,z)}function plan(){ctx.fillStyle='#e8e4de';ctx.fillRect(0,0,W,H);let k=Math.min(W/5.1,H/8.4),ox=W/2-1.955*k,oz=H/2-3.39*k;let rect=(x,z,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(ox+x*k,oz+z*k,w*k,h*k)};R.forEach(r=>{rect(r.x,r.z,r.w,r.h,r.fill);ctx.strokeStyle='#46515a';ctx.lineWidth=3;ctx.strokeRect(ox+r.x*k,oz+r.z*k,r.w*k,r.h*k);textAt(r.n,ox+(r.x+r.w/2)*k,oz+(r.z+r.h/2)*k-8,Math.max(9,Math.min(13,k*.17)));textAt(r.area,ox+(r.x+r.w/2)*k,oz+(r.z+r.h/2)*k+10,11)});furniture.forEach(f=>{rect(f.x,f.z,f.w,f.h,f.color);ctx.strokeStyle='#655543';ctx.lineWidth=1;ctx.strokeRect(ox+f.x*k,oz+f.z*k,f.w*k,f.h*k)});if(bed){rect(.55,3.12,1.4,2,'#e7c9b7');ctx.strokeStyle='#805f4c';ctx.strokeRect(ox+.55*k,oz+3.12*k,1.4*k,2*k)}textAt('ВХОД →',ox-.28*k,oz+.95*k,12);textAt('ОКНО',ox+4.22*k,oz+4.25*k,12);textAt('ДВЕРЬ НА ЛОДЖИЮ',ox+2.05*k,oz+5.76*k,11);textAt('КРОВАТЬ '+(bed?'РАЗЛОЖЕНА':'СЛОЖЕНА'),ox+1.3*k,oz+3.0*k,11)}
function three(){ctx.fillStyle='#1c2933';ctx.fillRect(0,0,W,H);R.forEach(r=>poly([[r.x,0,r.z],[r.x+r.w,0,r.z],[r.x+r.w,0,r.z+r.h],[r.x,0,r.z+r.h]],r.fill));let blocks=[...furniture];if(bed)blocks.push({x:.55,z:3.12,w:1.4,h:2,height:.45,color:'#e7c9b7'});blocks.sort((a,b)=>(a.x+a.z)-(b.x+b.z));blocks.forEach(f=>box(f.x,f.z,f.w,f.h,f.height,f.color));const walls=[[0,0,3.91,0],[0,0,0,6.78],[3.91,0,3.91,3.7],[3.91,4.85,3.91,6.78],[0,6.78,3.91,6.78],[0,1.85,1.5,1.85],[2.2,1.85,3.91,1.85],[2,0,2,1.15],[2,1.65,2,1.85]];walls.forEach(([x,z,X,Z])=>{let thick=.065;if(x===X)box(x-thick/2,z,thick,Z-z,1.65,'#d4c5b1');else box(x,z-thick/2,X-x,thick,1.65,'#d4c5b1')});ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.textAlign='left';ctx.fillText('Перетаскивай мышью для поворота',15,25)}function draw(){if(!W)return;mode==='plan'?plan():three()}document.getElementById('plan').onclick=()=>{mode='plan';document.getElementById('plan').className='active';document.getElementById('view').className='';draw()};document.getElementById('view').onclick=()=>{mode='3d';document.getElementById('view').className='active';document.getElementById('plan').className='';draw()};document.getElementById('left').onclick=()=>{mode='3d';angle-=Math.PI/4;document.getElementById('view').click();draw()};document.getElementById('right').onclick=()=>{mode='3d';angle+=Math.PI/4;document.getElementById('view').click();draw()};document.getElementById('bed').onclick=e=>{bed=!bed;e.target.textContent=bed?'Сложить кровать':'Разложить кровать';draw()};c.onpointerdown=e=>{drag=true;last=e.clientX;c.setPointerCapture(e.pointerId)};c.onpointerup=()=>drag=false;c.onpointercancel=()=>drag=false;c.onpointermove=e=>{if(drag&&mode==='3d'){angle+=(e.clientX-last)*.012;last=e.clientX;draw()}};resize();</script></body></html>
